<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Compras</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: #fff;
    padding: 20px;
}

h1 {
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.top-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

select, button {
    padding: 8px;
    border-radius: 6px;
    border: none;
}

button {
    cursor: pointer;
    background: #22c55e;
    color: #000;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    background: #1e293b;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #334155;
    text-align: center;
}

th {
    background: #334155;
}

input {
    width: 80px;
    padding: 5px;
    border-radius: 4px;
    border: none;
    text-align: center;
}

.item-name {
    text-align: left;
}

.total {
    font-weight: bold;
    background: #020617;
}

.positivo { color: #22c55e; }
.negativo { color: #ef4444; }
.neutro { color: #94a3b8; }

.add-btn {
    margin-bottom: 10px;
    background: #3b82f6;
    color: white;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Controle de Compras</h1>

<div class="top-bar">
    <select id="mes"></select>
    <select id="ano"></select>
</div>

<h2>ASSAÍ</h2>
<button class="add-btn" onclick="addItem('assai')">+ Adicionar Item</button>
<table id="assaiTable">
    <thead>
        <tr>
            <th>Item</th>
            <th>Qtd</th>
            <th>Preço</th>
            <th>Total</th>
            <th>Variação</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>AMAZON</h2>
<button class="add-btn" onclick="addItem('amazon')">+ Adicionar Item</button>
<table id="amazonTable">
    <thead>
        <tr>
            <th>Item</th>
            <th>Qtd</th>
            <th>Preço</th>
            <th>Total</th>
            <th>Variação</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>Total do Mês: R$ <span id="totalGeral">0.00</span></h2>
<button onclick="gerarPDFMes()">📄 PDF do Mês</button>
<button onclick="gerarPDFAno()">📊 PDF do Ano</button>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKKmt7Y4qWdD2n0aliR3jEN2q4CG9OvdU",
  authDomain: "controle-compras-3d295.firebaseapp.com",
  projectId: "controle-compras-3d295",
  storageBucket: "controle-compras-3d295.firebasestorage.app",
  messagingSenderId: "362807394371",
  appId: "1:362807394371:web:4a9a736a76a90b6b8b94f6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const mesSelect = document.getElementById("mes");
const anoSelect = document.getElementById("ano");

meses.forEach((m,i)=>{
    let op = document.createElement("option");
    op.value = i;
    op.textContent = m;
    mesSelect.appendChild(op);
});

for(let i=2024;i<=2030;i++){
    let op = document.createElement("option");
    op.value = i;
    op.textContent = i;
    anoSelect.appendChild(op);
}

mesSelect.value = new Date().getMonth();
anoSelect.value = new Date().getFullYear();
mesSelect.addEventListener("change", carregarMes);
anoSelect.addEventListener("change", carregarMes);

function chaveMes(){
    const mes = parseInt(mesSelect.value) + 1;
    return `${anoSelect.value}-${mes}`;
}

function chaveMesAnterior(){
    let m = parseInt(mesSelect.value);
    let a = parseInt(anoSelect.value);

    if(m === 0){
        m = 11;
        a--;
    } else {
        m--;
    }

    return `${a}-${m + 1}`; 
}

async function salvar(){
    const dados = {
        assai: getTableData("assaiTable"),
        amazon: getTableData("amazonTable")
    };

    await setDoc(doc(db, "compras", chaveMes()), dados);
}

let carregando = false;
async function carregarMes(){
    carregando = true;

    const ref = doc(db, "compras", chaveMes());
    const snap = await getDoc(ref);

    let dados;

    if(snap.exists()){
        dados = snap.data();
    } else {
        const refAnt = doc(db, "compras", chaveMesAnterior());
        const snapAnt = await getDoc(refAnt);

		if(snapAnt.exists()){
			const anterior = snapAnt.data();

            dados = {
                assai: (anterior.assai || []).map(i => ({
                    ...i,
                    qtd: 0, 
                    id: crypto.randomUUID()
                })),
                amazon: (anterior.amazon || []).map(i => ({
                    ...i,
                    qtd: 0, 
                    id: crypto.randomUUID()
                }))
            };
		} else {
			dados = {assai:[], amazon:[]};
		}

   
    }

    render("assaiTable", dados.assai);
    render("amazonTable", dados.amazon);

    atualizarTotal();

    carregando = false; 
}

function getTableData(id){
    let rows = document.querySelectorAll(`#${id} tbody tr`);
    let data = [];

    rows.forEach(r=>{
        let nome = r.children[0].innerText;
        let qtd = r.children[1].children[0].value;
        let preco = r.children[2].children[0].value;

		data.push({
			id: r.dataset.id,
			nome,
			qtd,
			preco
		});
    });

    return data;
}

async function render(id, data){
    let tbody = document.querySelector(`#${id} tbody`);
    tbody.innerHTML = "";

    data.forEach(item=>{
        let tr = document.createElement("tr");
        tr.dataset.id = item.id || crypto.randomUUID();

        tr.innerHTML = `
            <td contenteditable="true" class="item-name">${item.nome}</td>
            <td><input type="number" value="${item.qtd}"></td>
            <td><input type="number" value="${item.preco}"></td>
            <td class="totalItem">0</td>
            <td class="variacao"></td>
        `;

        tbody.appendChild(tr);
    });

    await atualizarTabela(id);
}

async function atualizarTabela(id){
    let rows = document.querySelectorAll(`#${id} tbody tr`);
    const refAnt = doc(db, "compras", chaveMesAnterior());
    const snapAnt = await getDoc(refAnt);
    let anterior = snapAnt.exists() ? snapAnt.data() : {};

    rows.forEach(r=>{
        let qtd = parseFloat(r.children[1].children[0].value) || 0;
        let preco = parseFloat(r.children[2].children[0].value) || 0;

        let total = qtd * preco;
        r.children[3].innerText = total.toFixed(2);

        let listaAnterior = anterior[id.includes("assai") ? "assai":"amazon"] || [];
		let nomeAtual = r.children[0].innerText.trim().toLowerCase();

		let achou = listaAnterior.find(i => 
			(i.nome || "").trim().toLowerCase() === nomeAtual
		);

        let variacao = r.children[4];

        if(achou){
            let old = parseFloat(achou.preco);
            let diff = preco - old;

            if(diff > 0){
                variacao.innerText = `+${diff.toFixed(2)}`;
                variacao.className = "positivo";
            } else if(diff < 0){
                variacao.innerText = diff.toFixed(2);
                variacao.className = "negativo";
            } else {
                variacao.innerText = "0";
                variacao.className = "neutro";
            }
        } else {
            variacao.innerText = "-";
        }
    });

    atualizarTotal();
}

function atualizarTotal(){
    let total = 0;

    document.querySelectorAll(".totalItem").forEach(t=>{
        total += parseFloat(t.innerText) || 0;
    });

    document.getElementById("totalGeral").innerText = total.toFixed(2);
}

function addItem(tipo){
    let table = document.querySelector(`#${tipo}Table tbody`);

	let tr = document.createElement("tr");
	tr.dataset.id = crypto.randomUUID();

    tr.innerHTML = `
        <td contenteditable="true" class="item-name">Novo Item</td>
        <td><input type="number" value="1"></td>
        <td><input type="number" value="0"></td>
        <td class="totalItem">0</td>
        <td>-</td>
    `;

    table.appendChild(tr);
}

async function gerarPDFMes(){
    const { jsPDF } = window.jspdf;
    const docPDF = new jsPDF();

    const mesNome = meses[mesSelect.value];
    const ano = anoSelect.value;

    let y = 15;

    // 🧾 CABEÇALHO
    docPDF.setFillColor(30, 41, 59); // fundo escuro
    docPDF.rect(0, 0, 210, 30, "F");

    docPDF.setTextColor(255,255,255);
    docPDF.setFontSize(16);
    docPDF.text("RELATÓRIO DE COMPRAS", 105, 12, null, null, "center");

    docPDF.setFontSize(11);
    docPDF.text(`${mesNome} / ${ano}`, 105, 20, null, null, "center");

    y = 40;
    docPDF.setTextColor(0,0,0);

    function desenharTabela(titulo, tabelaId){
        // título
        docPDF.setFontSize(13);
        docPDF.text(titulo, 10, y);
        y += 6;

        // cabeçalho da tabela
        docPDF.setFillColor(220,220,220);
        docPDF.rect(10, y, 190, 8, "F");

        docPDF.setFontSize(10);
        docPDF.text("Item", 12, y+5);
        docPDF.text("Qtd", 90, y+5);
        docPDF.text("Preço", 110, y+5);
        docPDF.text("Total", 140, y+5);
        docPDF.text("Var", 170, y+5);

        y += 10;

        let rows = document.querySelectorAll(`#${tabelaId} tbody tr`);

        rows.forEach(r=>{
            let nome = r.children[0].innerText;
            let qtd = r.children[1].children[0].value;
            let preco = r.children[2].children[0].value;
            let total = r.children[3].innerText;
            let variacao = r.children[4].innerText;

            docPDF.setFontSize(9);

            docPDF.text(nome.substring(0,25), 12, y);
            docPDF.text(qtd.toString(), 92, y);
            docPDF.text(`R$ ${preco}`, 110, y);
            docPDF.text(`R$ ${total}`, 140, y);
            docPDF.text(variacao, 170, y);

            y += 6;

            if(y > 280){
                docPDF.addPage();
                y = 15;
            }
        });

        y += 5;
    }

    desenharTabela("ASSAÍ", "assaiTable");
    desenharTabela("AMAZON", "amazonTable");

    // 💰 TOTAL DESTACADO
    const total = document.getElementById("totalGeral").innerText;

    y += 5;

    docPDF.setFillColor(34,197,94);
    docPDF.rect(10, y, 190, 10, "F");

    docPDF.setTextColor(0,0,0);
    docPDF.setFontSize(12);
    docPDF.text(`TOTAL DO MÊS: R$ ${total}`, 105, y+7, null, null, "center");

    y += 20;

    // 🧠 ANÁLISE
    let totalNum = parseFloat(total);
    let analise = "Gasto controlado";
    if(totalNum > 1000) analise = "Gasto elevado no mês";
    if(totalNum === 0) analise = "Mês sem compras";

    docPDF.setTextColor(0,0,0);
    docPDF.setFontSize(11);
    docPDF.text("Análise:", 10, y);
    y += 6;

    docPDF.setFontSize(10);
    docPDF.text(`- ${analise}`, 12, y);

    // rodapé
    docPDF.setFontSize(8);
    docPDF.setTextColor(150);
    docPDF.text(
        `Gerado automaticamente em ${new Date().toLocaleString()}`,
        105,
        290,
        null,
        null,
        "center"
    );

    docPDF.save(`Relatorio_${mesNome}_${ano}.pdf`);
}

async function gerarPDFAno(){
    const { jsPDF } = window.jspdf;
    const docPDF = new jsPDF();

    const ano = anoSelect.value;

    let y = 15;

    // 🧾 CABEÇALHO
    docPDF.setFillColor(30, 41, 59);
    docPDF.rect(0, 0, 210, 30, "F");

    docPDF.setTextColor(255,255,255);
    docPDF.setFontSize(16);
    docPDF.text("RELATÓRIO ANUAL", 105, 12, null, null, "center");

    docPDF.setFontSize(11);
    docPDF.text(`${ano}`, 105, 20, null, null, "center");

    y = 40;
    docPDF.setTextColor(0,0,0);

    let totais = [];

    // 📊 COLETA DADOS
    for(let m = 0; m < 12; m++){
        const ref = doc(db, "compras", `${ano}-${m+1}`);
        const snap = await getDoc(ref);

        let totalMes = 0;

        if(snap.exists()){
            const dados = snap.data();

            [...(dados.assai || []), ...(dados.amazon || [])].forEach(i=>{
                let qtd = parseFloat(i.qtd) || 0;
                let preco = parseFloat(i.preco) || 0;
                totalMes += qtd * preco;
            });
        }

        totais.push(totalMes);
    }

    // 📋 TABELA
    docPDF.setFontSize(13);
    docPDF.text("Resumo Mensal", 10, y);
    y += 6;

    docPDF.setFillColor(220,220,220);
    docPDF.rect(10, y, 190, 8, "F");

    docPDF.setFontSize(10);
    docPDF.text("Mês", 20, y+5);
    docPDF.text("Total (R$)", 140, y+5);

    y += 10;

    totais.forEach((total, i)=>{
        let nomeMes = meses[i];

        docPDF.setFontSize(10);
        docPDF.text(nomeMes, 20, y);
        docPDF.text(total.toFixed(2), 140, y);

        y += 6;

        if(y > 280){
            docPDF.addPage();
            y = 15;
        }
    });

    // 📊 ANÁLISE
    let soma = totais.reduce((a,b)=>a+b,0);
    let media = soma / 12;
    let maior = Math.max(...totais);
    let menor = Math.min(...totais);

    let mesMaior = meses[totais.indexOf(maior)];
    let mesMenor = meses[totais.indexOf(menor)];

    y += 10;

    // 💰 BOX TOTAL
    docPDF.setFillColor(34,197,94);
    docPDF.rect(10, y, 190, 10, "F");

    docPDF.setTextColor(0,0,0);
    docPDF.setFontSize(12);
    docPDF.text(`TOTAL NO ANO: R$ ${soma.toFixed(2)}`, 105, y+7, null, null, "center");

    y += 20;

    // 📈 DETALHES
    docPDF.setFontSize(11);
    docPDF.text("Análise Financeira:", 10, y);
    y += 6;

    docPDF.setFontSize(10);

    docPDF.text(`• Média mensal: R$ ${media.toFixed(2)}`, 12, y);
    y += 5;

    docPDF.text(`• Maior gasto: ${mesMaior} (R$ ${maior.toFixed(2)})`, 12, y);
    y += 5;

    docPDF.text(`• Menor gasto: ${mesMenor} (R$ ${menor.toFixed(2)})`, 12, y);
    y += 5;

    // 🧠 INTERPRETAÇÃO AUTOMÁTICA
    let analise = "Gastos equilibrados ao longo do ano";

    if(maior > media * 1.5){
        analise = "Existem picos de gastos em determinados meses";
    }

    if(soma === 0){
        analise = "Nenhuma compra registrada no ano";
    }

    y += 5;

    docPDF.text("Resumo:", 10, y);
    y += 5;

    docPDF.text(`- ${analise}`, 12, y);

    // 🕒 RODAPÉ
    docPDF.setFontSize(8);
    docPDF.setTextColor(150);
    docPDF.text(
        `Gerado automaticamente em ${new Date().toLocaleString()}`,
        105,
        290,
        null,
        null,
        "center"
    );

    docPDF.save(`Relatorio_Anual_${ano}.pdf`);
}

document.addEventListener("input", ()=>{
    atualizarTabela("assaiTable");
    atualizarTabela("amazonTable");
});
document.addEventListener("change", (e)=>{
    if(carregando) return;

    const isInput = e.target.tagName === "INPUT";
    const isEditable = e.target.isContentEditable;

    if(isInput || isEditable){
        salvar();
    }
});

window.addItem = addItem;
window.carregarMes = carregarMes;
window.gerarPDFMes = gerarPDFMes;
window.gerarPDFAno = gerarPDFAno;

carregarMes();
</script>

</body>
</html>
